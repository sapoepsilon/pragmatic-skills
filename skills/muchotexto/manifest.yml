name: muchotexto
description: >-
  Compress an answer to the tightest faithful length. Start at exactly one
  sentence and add a sentence only when the meaning would otherwise be lost.
  Works on the previous assistant turn or on a fresh question.
version: 0.1.0
license: MIT
authors:
  - github: sapoepsilon
tags:
  - brevity
  - communication
  - meta
trigger_keywords:
  - muchotexto
  - mucho texto
  - too long
  - tldr
  - one sentence
  - shorter
  - tighter
compatibility:
  claude_code:
    supported: true
    entry: claude-code/SKILL.md
    install_to: ~/.claude/skills/{name}/
  codex:
    supported: true
    entry: codex/prompt.md
    install_to: ~/.codex/prompts/{name}.md
permissions:
  network: false
  filesystem_write: false
  shell: false
